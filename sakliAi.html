<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f4f4f7" media="(prefers-color-scheme: light)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <script>
        (function() {
            function lockViewport() {
                var mv = document.querySelector('meta[name=viewport]');
                if (mv) mv.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content';
            }
            window.addEventListener('resize', lockViewport);
            document.addEventListener('touchstart', function(e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
            var last = 0;
            document.addEventListener('touchend', function(e) {
                var now = Date.now(); if (now - last < 300) e.preventDefault(); last = now;
            }, { passive: false });
        })();
    </script>
    <title>sakliAi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surface: #141416;
            --surface2: #1c1c1f;
            --surface3: #242428;
            --border: rgba(255,255,255,0.07);
            --border-active: rgba(255,255,255,0.14);
            --text-primary: #f0f0f2;
            --text-secondary: #6e6e78;
            --text-muted: #3e3e46;
            --accent: #4f8ef7;
            --accent-glow: rgba(79,142,247,0.18);
            --accent-dim: rgba(79,142,247,0.12);
            --danger: #f7524f;
            --success: #34c77b;
            --user-bubble: #1a2233;
            --user-bubble-border: rgba(79,142,247,0.22);
            --code-bg: #111114;
            --menu-bg: #111113;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --status-bar-color: #0d0d0f;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f4f4f7;
                --surface: #ffffff;
                --surface2: #f0f0f4;
                --surface3: #e8e8ee;
                --border: rgba(0,0,0,0.07);
                --border-active: rgba(0,0,0,0.14);
                --text-primary: #0f0f12;
                --text-secondary: #72727c;
                --text-muted: #b0b0bc;
                --accent: #2d6ef0;
                --accent-glow: rgba(45,110,240,0.12);
                --accent-dim: rgba(45,110,240,0.08);
                --danger: #e03030;
                --success: #1fa85a;
                --user-bubble: #e8effe;
                --user-bubble-border: rgba(45,110,240,0.22);
                --code-bg: #f8f8fc;
                --menu-bg: #fafafd;
                --status-bar-color: #f4f4f7;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; outline: none; }
        html { touch-action: pan-y; -ms-touch-action: pan-y; height: 100%; height: -webkit-fill-available; overflow-x: hidden; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            height: 100vh; height: 100dvh;
            width: 100vw;
            max-width: 100%;
            overflow: hidden;
            margin: 0; padding: 0;
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }
        
        .icon-btn, .auth-btn, .edit-msg-btn, .modal-actions button, #new-chat-btn, #clear-all-btn, #chat-history-list li, .user-message-bubble {
            transition: transform 0.12s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s, opacity 0.2s;
            will-change: transform;
        }
        
        .icon-btn:active, .auth-btn:active, .edit-msg-btn:active, .modal-actions button:active,
        #new-chat-btn:active, #clear-all-btn:active, .user-message-bubble:active {
            transform: scale(0.95) !important; opacity: 0.85;
        }

        #chat-history-list li.is-pressed {
            transform: scale(0.95) !important; opacity: 0.85;
        }

        #auth-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center; padding: 24px; background: var(--bg); z-index: 100; }
        .auth-box {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 100%; padding: 36px 28px;
            border-radius: var(--radius-xl);
            box-shadow: 0 24px 60px rgba(0,0,0,0.4);
            text-align: center;
        }
        @media (prefers-color-scheme: light) { .auth-box { box-shadow: 0 12px 40px rgba(0,0,0,0.08); } }
        .auth-image { margin-bottom: 28px; display: flex; justify-content: center; }

        .auth-form { display: flex; flex-direction: column; gap: 14px; text-align: left; }
        .auth-grp { display: flex; flex-direction: column; gap: 7px; }

        .auth-hide { display: none; opacity: 0; }
        .auth-hide.show { display: flex; opacity: 1; animation: fadeUp 0.35s cubic-bezier(0.4,0,0.2,1); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .auth-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; text-align: center; letter-spacing: 0.4px; text-transform: uppercase; }
        .auth-input {
            width: 100%; padding: 14px 18px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text-primary);
            font-size: 16px; font-family: 'Inter', sans-serif;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s;
            text-align: center;
        }
        .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        .auth-input:disabled { opacity: 0.5; cursor: not-allowed; }
        .auth-forgot { font-size: 13px; color: var(--accent); cursor: pointer; text-align: center; display: none; font-weight: 500; transition: opacity 0.2s; margin-top: 6px; }
        .auth-forgot:hover { opacity: 0.7; }
        .auth-btn {
            width: 100%; padding: 15px; border: none;
            border-radius: var(--radius-md);
            background: var(--accent); color: #fff;
            font-size: 15px; font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
            margin-top: 4px; letter-spacing: 0.2px;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .auth-btn:hover { opacity: 0.88; }
        .auth-spin { width: 17px; height: 17px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .app-view { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100vh; height: 100dvh; display: none; overflow: hidden; }
        #chat-container {
            width: 100%; height: 100%; 
            background-color: var(--bg);
            display: flex; flex-direction: column;
            overflow: hidden;
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        }
        @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
            #chat-container {
                max-width: 640px; height: 90vh; height: 90dvh;
                border-radius: var(--radius-lg);
                border: 1px solid var(--border);
                box-shadow: 0 32px 80px rgba(0,0,0,0.5);
                position: absolute; top: 5vh; left: 50%; transform: translateX(-50%);
            }
        }
        #chat-box { flex-grow: 1; padding: 16px 14px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 22px; scroll-behavior: smooth; }
        #chat-box::-webkit-scrollbar { width: 0; }

        .welcome-container { display: none; }
        #chat-box.empty .welcome-container {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; padding: 24px; margin: auto;
            animation: fadeUp 0.5s ease;
        }
        .welcome-greeting { font-size: 15px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 400; }
        #chat-box.empty .welcome-container > p:last-child {
            font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text-primary);
        }
        #chat-header {
            padding: 12px 14px 8px;
            flex-shrink: 0; position: sticky; top: 0; z-index: 10;
            background-color: var(--bg);
        }
        #header-bar {
            display: flex; align-items: center; justify-content: space-between;
            background-color: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 6px 10px;
        }
        #header-bar .header-title {
            flex-grow: 1; text-align: center;
            font-size: 16px; font-weight: 700;
            letter-spacing: -0.3px;
        }
        
        .icon-btn, #menu-btn {
            width: 42px; height: 42px; padding: 8px;
            background: none; border: none;
            color: var(--text-secondary);
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            border-radius: 50%; flex-shrink: 0;
            transition: background 0.2s, color 0.2s;
        }
        .icon-btn:hover, #menu-btn:hover { background: var(--surface3); color: var(--text-primary); }
        #add-btn { transition: transform 0.25s cubic-bezier(0.4,0,0.2,1), background 0.2s, color 0.2s; }

        #side-menu {
            position: fixed; top: 0; left: 0;
            width: 285px; height: 100%; height: 100dvh;
            background-color: var(--menu-bg);
            border-right: 1px solid var(--border);
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex; flex-direction: column;
            padding: 56px 14px 20px;
            box-sizing: border-box;
            box-shadow: 6px 0 40px rgba(0,0,0,0.35);
            overflow: hidden;
        }
        @media (prefers-color-scheme: light) { #side-menu { box-shadow: 6px 0 30px rgba(0,0,0,0.07); } }
        
        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 999; opacity: 0; visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        body.menu-open #side-menu { transform: translateX(0); }
        body.menu-open #menu-overlay { opacity: 1; visibility: visible; }

        .search-wrapper { display: flex; align-items: center; gap: 6px; width: 100%; margin-bottom: 14px; box-sizing: border-box; }
        #history-search {
            flex: 1 1 0; min-width: 0; padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        #history-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
        #history-search::placeholder { color: var(--text-muted); }
        #clear-all-btn {
            width: 36px; height: 36px; flex-shrink: 0;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(247,82,79,0.2);
            background: rgba(247,82,79,0.07);
            color: var(--danger); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        #clear-all-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }

        #chat-history-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; overflow-x: visible; flex-grow: 1; margin-bottom: 16px; }
        #chat-history-list::-webkit-scrollbar { width: 0; }
        .history-section-header {
            font-size: 10px; font-weight: 700; color: var(--text-muted);
            margin: 16px 0 8px 6px; text-transform: uppercase; letter-spacing: 1px;
            display: flex; align-items: center; gap: 6px;
        }
        .history-pinned-section { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        
        .history-folder-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            flex-shrink: 0;
            transition: color 0.15s;
        }
        #chat-history-list li:hover .history-folder-icon { color: var(--accent); }
        #chat-history-list li.active .history-folder-icon { color: var(--accent); }

        #chat-history-list li {
            position: relative; padding: 9px 12px;
            border-radius: var(--radius-sm); margin-bottom: 4px;
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            display: flex; justify-content: flex-start; align-items: center; gap: 10px;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s, border-color 0.15s;
        }
        #chat-history-list li:hover { background: var(--surface2); border-color: var(--border); }
        #chat-history-list li.active { background: var(--accent-dim); border-color: rgba(79,142,247,0.25); }
        .history-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; min-width: 0; font-size: 14px; }
        
        .history-options-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; width: 26px; height: 26px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; font-weight: 700; flex-shrink: 0;
            transition: background 0.15s, color 0.15s, transform 0.1s;
        }
        .history-options-btn:hover { background: var(--surface3); color: var(--text-primary); }
        .history-options-btn:active { transform: scale(0.85); background: var(--surface3); color: var(--text-primary); }

        #bs-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1100;
        }
        #bs-overlay.show { display: block; animation: bsFadeIn 0.2s ease forwards; }
        @keyframes bsFadeIn { from{opacity:0} to{opacity:1} }

        #bs-panel {
            display: none; position: fixed;
            left: 14px; bottom: 74px; 
            width: 257px; 
            z-index: 1101;
            background: var(--menu-bg); 
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        @media (prefers-color-scheme: light) {
            #bs-panel { box-shadow: 0 10px 30px rgba(0,0,0,0.12); }
        }
        #bs-panel.show {
            display: block;
            animation: bsUpBox 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
        }
        #bs-panel.hide { animation: bsDownBox 0.2s ease-in forwards; }
        @keyframes bsUpBox   { from{transform:translateY(100%); opacity:0;} to{transform:translateY(0); opacity:1;} }
        @keyframes bsDownBox { from{transform:translateY(0); opacity:1;}    to{transform:translateY(100%); opacity:0;} }

        .bs-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px;
            border: none; background: transparent; width: 100%;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 15px; font-weight: 500;
            cursor: pointer; text-align: left;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        .bs-item:last-child { border-bottom: none; }
        .bs-item:active { background: var(--surface2); }
        
        .bs-icon {
            width: 32px; height: 32px; border-radius: 8px;
            background: var(--surface2); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            color: var(--text-primary);
        }
        .bs-icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .bs-item.bs-delete { color: var(--danger); }
        .bs-item.bs-delete .bs-icon { background: rgba(247,82,79,0.1); border-color: rgba(247,82,79,0.2); color: var(--danger); }

        .history-dropdown { display: none !important; }

        #new-chat-btn {
            background: var(--accent); color: #fff;
            border: none; padding: 12px;
            border-radius: var(--radius-md);
            font-size: 14px; font-weight: 700;
            cursor: pointer; font-family: 'Inter', sans-serif;
            margin-top: auto; width: 100%;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .message-container { display: flex; flex-direction: column; position: relative; min-width: 0; max-width: 100%; }
        .user-message-container { align-self: flex-end; align-items: flex-end; max-width: 84%; }
        .bot-message-container { align-self: flex-start; align-items: flex-start; width: 100%; min-width: 0; }
        .message-text { font-size: 15px; line-height: 1.65; white-space: pre-wrap; font-weight: 400; word-break: break-word; overflow-wrap: anywhere; }
        
        .user-message-bubble {
            background: var(--user-bubble);
            border: 1px solid var(--user-bubble-border);
            padding: 10px 16px;
            border-radius: 18px 18px 4px 18px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .user-msg-text {
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            color: var(--text-primary);
        }

        .user-msg-text.collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .prompt-toggle-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 2px 0;
            margin-top: 2px;
            display: inline-block;
        }

        .bot-name {
            font-weight: 800; margin-bottom: 8px;
            color: var(--accent);
            display: flex; align-items: center; gap: 7px;
            font-size: 12px; letter-spacing: 0.3px;
        }

        #input-container {
            padding: 10px 16px 14px;
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            flex-shrink: 0; background: var(--bg);
            border-top: 1px solid var(--border);
        }

        #input-bar {
            display: flex;
            flex-direction: column;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 6px 8px;
            gap: 2px;
            min-height: 54px;
            transition: border-color 0.2s, box-shadow 0.2s, border-radius 0.2s;
        }
        #input-bar:focus-within { border-color: var(--border-active); box-shadow: 0 0 0 3px var(--accent-dim); }
        
        #input-bar.has-file {
            border-radius: 20px;
            padding-top: 8px;
        }

        .input-row {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 6px;
        }

        #user-input {
            flex-grow: 1; border: none; background: none;
            color: var(--text-primary); padding: 10px 10px;
            font-size: 16px; outline: none;
            font-family: 'Inter', sans-serif;
            resize: none; overflow-y: auto; overflow-x: hidden; max-height: 140px; line-height: 1.5;
            white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
        }
        #user-input::placeholder { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        #send-btn {
            background: var(--accent); color: #fff;
            width: 42px; height: 42px; border-radius: 50%;
            box-shadow: 0 2px 10px var(--accent-glow);
            transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
            flex-shrink: 0;
        }
        #send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 16px var(--accent-glow); }

        #file-preview-container {
            display: none;
            align-self: flex-start;
            padding: 5px 12px 5px 8px;
            margin: 2px 6px 4px 6px;
            background: var(--surface3);
            border: 1px solid var(--border);
            border-radius: 14px;
            max-width: calc(100% - 12px);
        }
        #file-preview-container.invalid-file {
            background: rgba(247,82,79,0.12);
            border-color: rgba(247,82,79,0.45);
        }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOutDown { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(4px); } }
        
        .file-preview-inner { display: flex; align-items: center; gap: 8px; }
        .file-preview-icon.doc-icon { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .file-preview-icon.doc-icon svg { width: 22px; height: 22px; display: block; }
        .file-preview-info { flex-grow: 1; min-width: 0; }
        .file-preview-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
        .file-preview-type { font-size: 10px; color: var(--text-secondary); }
        #remove-file-btn { background: none; color: var(--text-muted); border: none; width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-size: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; line-height: 1; margin-left: 2px; }
        #remove-file-btn:hover { color: var(--text-primary); background: var(--surface2); }

        .msg-file-chip {
            display: inline-flex; align-items: center; gap: 7px;
            background: rgba(255,255,255,0.06); border: 1px solid var(--border);
            border-radius: 20px; padding: 4px 10px 4px 6px;
            max-width: 100%;
        }
        @media (prefers-color-scheme: light) {
            .msg-file-chip { background: rgba(0,0,0,0.04); }
        }
        .msg-file-chip .chip-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 18px; height: 18px; }
        .msg-file-chip .chip-icon svg { width: 100%; height: 100%; display: block; }
        .msg-file-chip .chip-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }

<script>
    const supabaseUrl = 'https://kipqhwyqhzmpvlslzdky.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpcHFod3lxaHptcHZsc2x6ZGt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NDM0NzMsImV4cCI6MjEwMjIxOTQ3M30.NDNXyRStRpjT0EH3yDnHevDDIHmOMeK_UqkR4UM57lo';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

    function drawAvatarOnCanvas(canvas, name) {
        var letter = (name && name.trim().length > 0) ? name.trim()[0].toUpperCase() : 'U';
        var size = canvas.width;
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, size, size);
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.arc(size/2, size/2, size/2, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold ' + Math.round(size * 0.42) + 'px Inter, Arial, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(letter, size/2, size/2 + 1);
    }

    function setProfileAvatar(name) {
        var n = (name && name.trim()) ? name : 'U';
        var p1 = document.getElementById('profile-icon');
        var p2 = document.getElementById('dashboard-profile-icon');
        if (p1) drawAvatarOnCanvas(p1, n);
        if (p2) drawAvatarOnCanvas(p2, n);
    }

    function openModalState(type) {
        if (type === 'menu') document.body.classList.add('menu-open');
        else if (type === 'profile') {
            const name = window._currentUserName || 'User';
            setProfileAvatar(name);
            const inp = document.getElementById('user-name-input');
            if (inp) inp.value = name !== 'User' ? name : '';
            document.getElementById('profile-dashboard-modal').classList.add('show');
        }
        else if (type === 'confirm') document.getElementById('confirm-modal').classList.add('show');
        else if (type === 'prompt') document.getElementById('custom-prompt-modal').classList.add('show');
        history.pushState({ modalActive: type }, '');
    }

    function closeActiveModalManually() {
        const isMenuOpen = document.body.classList.contains('menu-open');
        const isProfileOpen = document.getElementById('profile-dashboard-modal').classList.contains('show');
        const isConfirmOpen = document.getElementById('confirm-modal').classList.contains('show');
        const isPromptOpen = document.getElementById('custom-prompt-modal').classList.contains('show');
        if (isMenuOpen || isProfileOpen || isConfirmOpen || isPromptOpen) {
            history.back();
        }
    }

    window.addEventListener('popstate', () => {
        document.body.classList.remove('menu-open');
        document.getElementById('profile-dashboard-modal').classList.remove('show');
        document.getElementById('confirm-modal').classList.remove('show');
        document.getElementById('custom-prompt-modal').classList.remove('show');
        document.querySelectorAll('.history-dropdown').forEach(d => d.classList.remove('show'));
    });

    function showCustomPrompt(title, defaultText, callback) {
        document.getElementById('custom-prompt-title').textContent = title;
        const input = document.getElementById('custom-prompt-input');
        input.value = defaultText || '';
        openModalState('prompt');
        setTimeout(() => input.focus(), 100);

        const saveBtn = document.getElementById('custom-prompt-save-btn');
        const cancelBtn = document.getElementById('custom-prompt-cancel-btn');

        saveBtn.onclick = () => {
            const val = input.value;
            closeActiveModalManually();
            if(callback) callback(val);
        };
        cancelBtn.onclick = () => { closeActiveModalManually(); };
    }

    document.getElementById('custom-prompt-modal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('custom-prompt-modal')) closeActiveModalManually();
    });

    let authStep = 0;
    let isSignUpMode = false;

    const authEm = document.getElementById('auth-em'), authNm = document.getElementById('auth-nm'), authPw = document.getElementById('auth-pw'), authCpw = document.getElementById('auth-cpw');
    const authNg = document.getElementById('auth-ng'), authPg = document.getElementById('auth-pg'), authCpg = document.getElementById('auth-cpg');
    const authSbtn = document.getElementById('auth-sbtn'), authBtxt = document.getElementById('auth-btxt'), authSpin = document.getElementById('auth-spin');
    const authSub = document.getElementById('auth-sub'), authPlbl = document.getElementById('auth-plbl');

    authPw.addEventListener('input', () => document.getElementById('auth-error').style.display = 'none');
    if(authCpw) authCpw.addEventListener('input', () => document.getElementById('auth-error').style.display = 'none');

    const toggleAuthFields = (fields, inputs, show) => {
        fields.forEach(f => {
            if(show) {
                f.style.display = 'flex';
                setTimeout(() => f.classList.add('show'), 10);
            } else {
                f.classList.remove('show');
                f.style.display = 'none';
            }
        });
        inputs.forEach(i => { i.required = show; if(!show) i.value = ''; });
    };

    const loadAuthStatus = (on, text = "Checking...") => {
        authSpin.style.display = on ? 'block' : 'none';
        authSbtn.style.opacity = on ? '0.7' : '1';
        authSbtn.style.pointerEvents = on ? 'none' : 'auto';
        if(on) authBtxt.textContent = text;
    };

    window.resetEmail = function() {
        authStep = 0;
        authEm.disabled = false;
        authEm.focus();
        authSub && (authSub.textContent = "Enter your email to continue");
        document.getElementById('change-email-btn').style.display = 'none';
        toggleAuthFields([authNg, authPg, authCpg], [authNm, authPw, authCpw], false);
        document.getElementById('auth-forgot').style.display = 'none';

    async function handleAuth(e) {
        e.preventDefault();
        const emailValue = authEm.value.trim().toLowerCase();
        const authError = document.getElementById('auth-error');
        authError.style.display = 'none';

        if (authStep === 0) {
            loadAuthStatus(true, "Checking...");
            const { data: exists, error } = await supabaseClient.rpc('check_email_exists', { lookup_email: emailValue });
            loadAuthStatus(false);

            if (error) {
                authError.innerHTML = "⚠️ Connection anomaly detected.";
                authError.style.display = 'block';
                return;
            }

            authEm.disabled = true;
            document.getElementById('change-email-btn').style.display = 'inline';

            if (exists) {
                isSignUpMode = false;
                authStep = 1;
                authSub && (authSub.textContent = "Welcome back! Enter your password");
                toggleAuthFields([authNg, authCpg], [authNm, authCpw], false);
                toggleAuthFields([authPg], [authPw], true);
                document.getElementById('auth-forgot').style.display = 'block';
                authBtxt.textContent = "Log In";
                authPw.focus();
            } else {
                isSignUpMode = true;
                authStep = 2;
                authSub && (authSub.textContent = "Create a new account");
                toggleAuthFields([authNg, authPg, authCpg], [authNm, authPw, authCpw], true);
                document.getElementById('auth-forgot').style.display = 'none';
                authBtxt.textContent = "Sign Up";
                authNm.focus();
            }

        } else if (authStep === 1) {
            loadAuthStatus(true, "Logging in...");
            const { error } = await supabaseClient.auth.signInWithPassword({ email: emailValue, password: authPw.value });
            if(error) {
                authError.textContent = error.message;
                authError.style.display = 'block';
                loadAuthStatus(false);
                authPw.value = ''; authPw.focus();
            } else {
                window.location.reload();
            }

        } else if (authStep === 2) {
            if (authPw.value !== authCpw.value) {
                authError.textContent = "Passwords do not match!";
                authError.style.display = 'block';
                return;
            }
            loadAuthStatus(true, "Creating account...");
            const { data, error } = await supabaseClient.auth.signUp({ email: emailValue, password: authPw.value });

            if(error) {
                authError.textContent = error.message;
                authError.style.display = 'block';
                loadAuthStatus(false);
            } else {
                if(data.user && authNm.value.trim()) {
                    await supabaseClient.from('profiles').upsert({ id: data.user.id, full_name: authNm.value.trim() });
                }
                loadAuthStatus(false);
                const regSuccessEl = document.getElementById('auth-reg-success');
                if(regSuccessEl) regSuccessEl.style.display = 'block';
                setTimeout(() => window.location.reload(), 1800);
            }
        }
    }

        function genId() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {

            init: function() {

                    const req = indexedDB.open('sakliAiDB', 1);
                    req.onupgradeneeded = (e) => {
                        e.target.result.createObjectStore('store');
                    };
                    req.onsuccess = async (e) => {
                        this.db = e.target.result;
                        try {
                            if (localStorage.getItem('sakliAi_chats')) {
                                await this.set('sakliAi_chats', localStorage.getItem('sakliAi_chats'));
                                localStorage.removeItem('sakliAi_chats');

                        resolve();

            get: function(key) {
                return new Promise((resolve, reject) => {
                    if (!this.db) return resolve(null);
                    const tx = this.db.transaction('store', 'readonly');
                    const req = tx.objectStore('store').get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(tx.error);
                });
            },
            set: function(key, val) {
                return new Promise((resolve, reject) => {
                    if (!this.db) return resolve();
                    const tx = this.db.transaction('store', 'readwrite');
                    const req = tx.objectStore('store').put(val, key);
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(tx.error);
                });
            },
            clearAll: function() {
                return new Promise((resolve, reject) => {
                    if (!this.db) return resolve();
                    const tx = this.db.transaction('store', 'readwrite');
                    const req = tx.objectStore('store').clear();
                    req.onsuccess = () => resolve();
                    req.onerror = () => reject(tx.error);

        async function syncDataFromSupabase(userId) {
            const { data: profile, error: fetchErr } = await supabaseClient.from('profiles').select('*').eq('id', userId).single();

                currentUserName = profile.full_name || 'User'; window._currentUserName = currentUserName;

                            const welcomeContainer = chatBox.querySelector('.welcome-container');

                document.getElementById('user-name-input').value = currentUserName;
                setProfileAvatar(currentUserName);

            const { data: dbMsgs } = await supabaseClient.from('messages').select('*').eq('user_id', userId).order('created_at', { ascending: true });

            let localChatsStr = await idbStore.get('sakliAi_chats');
            let localChats = localChatsStr ? JSON.parse(localChatsStr) : {};

            const cloudChatIds = new Set((dbChats || []).map(c => c.id));

            let mergedChats = {};

            const unsyncedChatIds = [];
            Object.keys(localChats).forEach(id => {
                mergedChats[id] = { ...localChats[id] };
                if (!cloudChatIds.has(id)) unsyncedChatIds.push(id);
            });

            if(dbChats) {
                dbChats.forEach(c => {
                    if(!mergedChats[c.id]) {
                        mergedChats[c.id] = { title: c.title, isPinned: c.is_pinned === true, messages: [] };
                    } else {
                        mergedChats[c.id].isPinned = c.is_pinned === true;
                        if(c.title && c.title !== "New Chat") mergedChats[c.id].title = c.title;
                    }

            if(dbMsgs) {

                    if(!cloudMsgs[m.chat_id]) cloudMsgs[m.chat_id] = [];
                    cloudMsgs[m.chat_id].push({
                        content: m.content, isUser: m.is_user, clientId: m.client_id || genId(),
                        file: m.file_url ? { name: m.file_url.split('/').pop(), textContent: '[Media file]', type: '' } : null
                    });
                });

                Object.keys(cloudMsgs).forEach(chatId => {
                    if(mergedChats[chatId]) {
                        if(!mergedChats[chatId].messages || cloudMsgs[chatId].length > mergedChats[chatId].messages.length) {
                            mergedChats[chatId].messages = cloudMsgs[chatId];
                        }
                    }
                });
            }

            chats = mergedChats;
            saveChatsLocally();

            if (navigator.onLine && unsyncedChatIds.length > 0) {
                pushUnsyncedChatsToCloud(unsyncedChatIds, userId).catch(() => {});

        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const textTypes = ['text/', 'application/json', 'application/xml', 'application/javascript', 'application/typescript'];
                const isText = textTypes.some(t => file.type.startsWith(t)) ||
                    /\.(txt|md|csv|html|htm|css|js|ts|jsx|tsx|py|java|c|cpp|h|php|rb|go|rs|swift|kt|sh|bat|sql|xml|json|yaml|yml|ini|env|log|gitignore|toml|scss|sass|less|vue|svelte)$/i.test(file.name);
                const r = new FileReader();
                r.onerror = reject;
                if (isText) {
                    r.onload = e => resolve(e.target.result);
                    r.readAsText(file);
                } else {
                    r.onload = e => resolve(`[Attached file: ${file.name} (${(file.size/1024).toFixed(1)} KB) — binary file, content not extractable as text]`);
                    r.readAsArrayBuffer(file);
                }
            });
        }

        function downloadImage(url, filename) {
            fetch(url)
                .then(response => response.blob())
                .then(blob => {
                    if (window.AndroidBlobDownloader && typeof window.AndroidBlobDownloader.getBase64FromBlobData === 'function') {
                        // Running inside the Android WebView app: hand the image off to the
                        // native bridge, which saves it via MediaStore/Downloads.
                        const reader = new FileReader();
                        reader.onloadend = function() {
                            window.AndroidBlobDownloader.getBase64FromBlobData(reader.result);
                        };
                        reader.onerror = function() {
                            alert('Failed to download image.');
                        };
                        reader.readAsDataURL(blob);
                    } else {
                        // Plain browser fallback (e.g. testing sakliAi.html outside the app).
                        const blobUrl = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = blobUrl;
                        a.download = filename || 'generated_image.png';
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(blobUrl);
                        document.body.removeChild(a);
                    }
                })
                .catch(() => alert('Failed to download image.'));
        }

        async function typewriterEffect(container, text, labelEl, speed = 10, reqChatId = currentChatId) {
            return new Promise((resolve) => {
                const codeBlockRegex = /```(\w*)\n([\s\S]*?)```/g; let lastIndex = 0, match; const segments = [];
                while ((match = codeBlockRegex.exec(text)) !== null) {
                    if (match.index > lastIndex) segments.push({ type: 'text', content: text.substring(lastIndex, match.index) });
                    segments.push({ type: 'code', lang: match[1] || 'code', content: match[2].trim() }); lastIndex = codeBlockRegex.lastIndex;
                }
                if (lastIndex < text.length) segments.push({ type: 'text', content: text.substring(lastIndex) });
                if (segments.length === 0) segments.push({ type: 'text', content: text });
                let segIndex = 0;

                function processNextSegment() {
                    if (!isGenerating || currentChatId !== reqChatId) { resolve(); return; }

                    if (document.visibilityState === 'hidden') {
                        resolve(); instantCompleteBotResponse(); return;
                    }

                    if (segIndex >= segments.length) { if (labelEl) { const dots = labelEl.querySelector('.writing-dots'); if (dots) dots.remove(); } resolve(); return; }
                    const seg = segments[segIndex++];
                    if (seg.type === 'code') { 
                        container.appendChild(createCodeBlockElement(seg.content, seg.lang)); 
                        scrollToBottomIfNeeded(); 
                        processNextSegment(); 
                    } else {
                        const textDiv = document.createElement('div'); textDiv.className = 'message-text'; container.appendChild(textDiv);
                        let i = 0; const chars = seg.content;
                        function typeChar() {
                            if (!isGenerating || currentChatId !== reqChatId) { resolve(); return; }

                            if (document.visibilityState === 'hidden') {
                                resolve(); instantCompleteBotResponse(); return;
                            }

                            if (i < chars.length) {
                                textDiv.innerHTML = escapeHTML(chars.substring(0, i + 1)).replace(/\n/g, '<br>') + '<span class="cursor-blink">▌</span>';
                                scrollToBottomIfNeeded(); 
                                i++;
                                let tId = setTimeout(typeChar, speed); typewriterTimeouts.push(tId);
                            } else { textDiv.innerHTML = escapeHTML(chars).replace(/\n/g, '<br>'); processNextSegment(); }
                        }
                        typeChar();
                    }
                }
                processNextSegment();
            });
        }

        function instantCompleteBotResponse() {
            if (!activeTypewriter) return;
            typewriterTimeouts.forEach(clearTimeout); typewriterTimeouts = [];
            const { container, text, botNameEl, msgIndex, reqChatId } = activeTypewriter;

            if (botNameEl) { const dots = botNameEl.querySelector('.writing-dots'); if (dots) dots.remove(); }
            const nodesToRemove = [];
            container.childNodes.forEach(n => { if (n !== botNameEl) nodesToRemove.push(n); });
            nodesToRemove.forEach(n => n.remove());

            const codeBlockRegex = /```(\w*)\n([\s\S]*?)```/g; let lastIndex = 0, match;
            while ((match = codeBlockRegex.exec(text)) !== null) {
                const textBefore = text.substring(lastIndex, match.index).trim();
                if (textBefore) { const d = document.createElement('div'); d.className = 'message-text'; d.innerHTML = escapeHTML(textBefore).replace(/\n/g, '<br>'); container.appendChild(d); }
                container.appendChild(createCodeBlockElement(match[2].trim(), match[1] || 'code')); lastIndex = codeBlockRegex.lastIndex;
            }
            const textAfter = text.substring(lastIndex).trim();
            if (textAfter) { const d = document.createElement('div'); d.className = 'message-text'; d.innerHTML = escapeHTML(textAfter).replace(/\n/g, '<br>'); container.appendChild(d); }
            if (!container.querySelector('.bot-action-bar')) { appendBotActionBar(container, text, msgIndex); }

            removeTypingIndicator(); resetSendButtonUI(); isGenerating = false; activeTypewriter = null;
            if (currentChatId === reqChatId) { scrollToBottomIfNeeded(); }
        }

            displayWelcomeInterface();
        }

        idbStore.init().then(async () => {
            await initializeAppLocals();
            initializeApp();
        }).catch(async (err) => {
            console.error("IndexedDB failed to init", err);
            await initializeAppLocals();
            initializeApp();
        });

        menuBtn.addEventListener('click', () => openModalState('menu'));
        menuOverlay.addEventListener('click', () => closeActiveModalManually());
        addBtn.addEventListener('click', () => { setMode('chat'); fileUploadInput.click(); });
        fileUploadInput.addEventListener('change', handleFileUpload);
        imageModeBtn.addEventListener('click', () => { setMode(currentMode === 'image' ? 'chat' : 'image'); });

        function setMode(mode) {
            currentMode = mode;
            if (mode === 'image') {
                imageModeBtn.classList.add('mode-active');
                imageModeBtn.title = 'Image mode active — tap for Chat';
                userInput.placeholder = 'Describe an image...';
            } else {
                imageModeBtn.classList.remove('mode-active');
                imageModeBtn.title = 'Image mode';
                userInput.placeholder = 'Start typing...';
            }
        }
        setMode('chat');
    });
</script>
</body>
</html>
